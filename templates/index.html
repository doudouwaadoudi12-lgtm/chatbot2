<!DOCTYPE html>
<html>
<head>
    <title>Chatbot IA</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        input {
            width: 80%;
            max-width: 400px;
            height: 40px;
            font-size: 16px;
            padding: 5px;
        }

        button {
            height: 45px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🤖 Chatbot IA</h1>

    <form method="post">
        <input type="text" name="question" placeholder="Posez votre question..." required>
        <br><br>
        <button type="submit">Envoyer</button>
    </form>

    <div class="result">
        {{ result }}
    </div>

</body>
</html>
